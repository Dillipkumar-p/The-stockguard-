
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock | Delete Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="delete">
    <aside class="sidebar">
        <h2>SmartStock</h2>
        <p>Inventory Management</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="add-product.html">Add Product</a>
            <a href="search.html">Search Products</a>
            <a class="active" href="delete.html">Delete Products</a>
        </nav>
    </aside>

    <main class="main-content">
        <header>
            <div>
                <h1>Delete Products</h1>
                <p>Choose a product to remove from inventory.</p>
            </div>
        </header>

        <section class="panel">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Expiry Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryBody"></tbody>
                </table>
            </div>
            <p id="message" role="status"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
